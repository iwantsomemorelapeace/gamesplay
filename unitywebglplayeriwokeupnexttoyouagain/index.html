<!DOCTYPE html>
<base href="https://cdn.jsdelivr.net/gh/waycrosspublicmedia/whatver/nextyou/">
<html lang="en-us">
<head>
<link rel="icon" type="image/png" href="https://northallegheny.us004-rapididentity.com:443/files/NAlogo_gold_flat.png">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Dashboard | RapidIdentity</title>
  <script src="Build/UnityLoader.js"></script>
  <script>
    var gameInstance;

    window.addEventListener("load", function() {
      gameInstance = UnityLoader.instantiate("gameContainer", "Build/web.json");
      resizeGame();
      window.addEventListener("resize", resizeGame);
    });

    function resizeGame() {
      var container = document.getElementById("gameContainer");
      container.style.width = window.innerWidth + "px";
      container.style.height = window.innerHeight + "px";

      if (gameInstance && gameInstance.Module) {
        gameInstance.Module.canvas.style.width = window.innerWidth + "px";
        gameInstance.Module.canvas.style.height = window.innerHeight + "px";
      }
    }
  </script>
  <link rel="" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    #gameContainer {
      display: block;
    }
  </style>
<script type="module" src="https://ineedsomemorelapeace.github.io/games/assets/chat-notifications.js"></script>
</head>
<body>
  <div id="gameContainer"></div>
</body>
</html>
